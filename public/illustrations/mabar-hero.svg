<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6faf4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" fill="url(#skyGrad)"/>

  <!-- decorative dots -->
  <circle cx="40" cy="30" r="4" fill="#13B98F" opacity="0.25"/>
  <circle cx="365" cy="45" r="6" fill="#13B98F" opacity="0.2"/>
  <circle cx="330" cy="20" r="3" fill="#13B98F" opacity="0.3"/>
  <circle cx="20" cy="120" r="3" fill="#13B98F" opacity="0.25"/>

  <!-- court floor -->
  <ellipse cx="200" cy="165" rx="190" ry="14" fill="#13B98F" opacity="0.12"/>

  <!-- net -->
  <g>
    <rect x="195" y="70" width="4" height="80" fill="#0e8f6f"/>
    <rect x="150" y="70" width="94" height="34" fill="#ffffff" stroke="#13B98F" stroke-width="2"/>
    <line x1="150" y1="80" x2="244" y2="80" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="90" x2="244" y2="90" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="100" x2="244" y2="100" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="70" x2="160" y2="104" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="70" x2="180" y2="104" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="70" x2="200" y2="104" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
    <line x1="220" y1="70" x2="220" y2="104" stroke="#13B98F" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- player left -->
  <g transform="translate(95,95)">
    <ellipse cx="0" cy="68" rx="22" ry="6" fill="#0e8f6f" opacity="0.15"/>
    <circle cx="0" cy="-8" r="13" fill="#ffd7ae"/>
    <path d="M -13 -8 a13 13 0 0 1 26 0" fill="#252525"/>
    <rect x="-16" y="4" width="32" height="34" rx="10" fill="#13B98F"/>
    <rect x="-16" y="34" width="13" height="30" rx="5" fill="#252525"/>
    <rect x="3" y="34" width="13" height="30" rx="5" fill="#252525"/>
    <g transform="rotate(-25)">
      <rect x="18" y="-6" width="26" height="4" rx="2" fill="#8a5a2e"/>
      <ellipse cx="54" cy="-4" rx="16" ry="20" fill="none" stroke="#252525" stroke-width="3"/>
      <ellipse cx="54" cy="-4" rx="16" ry="20" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- player right -->
  <g transform="translate(300,95) scale(-1,1)">
    <ellipse cx="0" cy="68" rx="22" ry="6" fill="#0e8f6f" opacity="0.15"/>
    <circle cx="0" cy="-8" r="13" fill="#e8b48a"/>
    <path d="M -13 -8 a13 13 0 0 1 26 0" fill="#2b2b2b"/>
    <rect x="-16" y="4" width="32" height="34" rx="10" fill="#0e8f6f"/>
    <rect x="-16" y="34" width="13" height="30" rx="5" fill="#252525"/>
    <rect x="3" y="34" width="13" height="30" rx="5" fill="#252525"/>
    <g transform="rotate(20)">
      <rect x="18" y="-4" width="24" height="4" rx="2" fill="#8a5a2e"/>
      <ellipse cx="52" cy="-2" rx="15" ry="19" fill="none" stroke="#252525" stroke-width="3"/>
      <ellipse cx="52" cy="-2" rx="15" ry="19" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- shuttlecock -->
  <g transform="translate(200,40) rotate(15)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#252525" stroke-width="1.5"/>
    <path d="M -4 -3 L -14 -16 L -2 -8 Z" fill="#ffffff" stroke="#252525" stroke-width="1"/>
    <path d="M 0 -5 L -4 -20 L 3 -9 Z" fill="#ffffff" stroke="#252525" stroke-width="1"/>
    <path d="M 4 -3 L 10 -18 L 6 -6 Z" fill="#ffffff" stroke="#252525" stroke-width="1"/>
  </g>
  <path d="M 130 70 Q 165 25 195 42" fill="none" stroke="#13B98F" stroke-width="2" stroke-dasharray="4 5" opacity="0.4"/>
</svg>
