<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13B98F"/>
      <stop offset="100%" stop-color="#0e8f6f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" fill="url(#sky)"/>

  <!-- decorative circles -->
  <circle cx="60" cy="40" r="26" fill="#ffffff" opacity="0.08"/>
  <circle cx="540" cy="60" r="40" fill="#ffffff" opacity="0.07"/>
  <circle cx="500" cy="20" r="14" fill="#ffffff" opacity="0.1"/>

  <!-- court -->
  <rect x="40" y="180" width="520" height="60" fill="#0b7a5e"/>
  <rect x="40" y="180" width="520" height="60" fill="#ffffff" opacity="0.04"/>
  <line x1="40" y1="210" x2="560" y2="210" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="150" x2="300" y2="210" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="260" y1="150" x2="340" y2="150" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- player left (abstract) -->
  <g transform="translate(220,150)">
    <ellipse cx="0" cy="34" rx="16" ry="6" fill="#000000" opacity="0.12"/>
    <rect x="-9" y="-8" width="18" height="34" rx="8" fill="#ffffff"/>
    <circle cx="0" cy="-22" r="13" fill="#ffe0b2"/>
    <g transform="rotate(-30)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <line x1="10" y1="-6" x2="26" y2="-18"/>
    </g>
    <ellipse cx="30" cy="-24" rx="9" ry="12" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(-20 30 -24)"/>
  </g>

  <!-- player right (abstract) -->
  <g transform="translate(380,150) scale(-1,1)">
    <ellipse cx="0" cy="34" rx="16" ry="6" fill="#000000" opacity="0.12"/>
    <rect x="-9" y="-8" width="18" height="34" rx="8" fill="#e6faf4"/>
    <circle cx="0" cy="-22" r="13" fill="#f6c199"/>
    <g transform="rotate(-30)" stroke="#e6faf4" stroke-width="4" stroke-linecap="round">
      <line x1="10" y1="-6" x2="26" y2="-18"/>
    </g>
    <ellipse cx="30" cy="-24" rx="9" ry="12" fill="none" stroke="#e6faf4" stroke-width="3" transform="rotate(-20 30 -24)"/>
  </g>

  <!-- shuttlecock -->
  <g transform="translate(300,90)">
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <path d="M -4 -3 L -14 -20 M 0 -5 L 0 -24 M 4 -3 L 14 -20" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.15">
    <ellipse cx="110" cy="55" rx="22" ry="10"/>
    <ellipse cx="128" cy="50" rx="16" ry="8"/>
    <ellipse cx="470" cy="100" rx="26" ry="11"/>
    <ellipse cx="450" cy="95" rx="16" ry="8"/>
  </g>
</svg>
